name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build, test and check coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END {
              print "### Test coverage"
              print ""
              print "| Lines | Branches |"
              print "|---|---|"
              printf "| %.1f%% | %.1f%% |\n", 100 * lc / (lm + lc), 100 * bc / (bm + bc)
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cheems-quest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
