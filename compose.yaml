services:
  postgres:
    image: postgres:17-alpine
    container_name: cheemsquest-db
    environment:
      POSTGRES_DB: cheemsquest
      POSTGRES_USER: cheems
      POSTGRES_PASSWORD: cheems
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheems -d cheemsquest"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: cheems-quest:latest
    container_name: cheemsquest-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cheemsquest
      DB_USER: cheems
      DB_PASSWORD: cheems
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
