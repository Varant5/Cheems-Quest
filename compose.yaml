services:
  postgres:
    image: postgres:17-alpine
    container_name: cheemsquest-db
    environment:
      POSTGRES_DB: cheemsquest
      POSTGRES_USER: cheems
      POSTGRES_PASSWORD: cheems
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheems -d cheemsquest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
