spring:
  application:
    name: cheems-quest
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cheemsquest}
    username: ${DB_USER:cheems}
    password: ${DB_PASSWORD:cheems}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      lifecycle-management: start-only
