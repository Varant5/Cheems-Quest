spring:
  application:
    name: cheems-quest
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cheemsquest}
    username: ${DB_USER:cheems}
    password: ${DB_PASSWORD:cheems}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      lifecycle-management: start-only
      start:
        arguments: postgres

cheemsquest:
  jwt:
    secret: ${JWT_SECRET:sAg7UtrbAbFXE9LBAsqCWy1VhiNRmQ9ueb/kDAbUrNp0C9i5MA7GSxA6smEJFMkv}
    ttl: ${JWT_TTL:1h}
